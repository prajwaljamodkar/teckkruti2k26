# ── Server ──────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── H2 in-memory database (dev / demo) ──────────────────────
spring.datasource.url=jdbc:h2:mem:teckkruti;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Ensure Hibernate creates tables before data.sql is executed
spring.jpa.defer-datasource-initialization=true

# ── H2 console (accessible at /h2-console in dev) ───────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Seed data ───────────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# ── Logging ─────────────────────────────────────────────────
logging.level.com.teckkruti=INFO
